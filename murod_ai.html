<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murod AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #7fff6e;
    --accent2: #4fd1c5;
    --text: #f0f0f0;
    --muted: #888;
    --danger: #ff6b6b;
    --user-bubble: #1a2a1a;
    --bot-bubble: #1a1a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .logo-text { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.02em; }
  .logo-text span { color: var(--accent); }

  .header-actions { display: flex; gap: 8px; }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 57px);
  }

  .sidebar {
    width: 260px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    transition: width 0.3s;
    overflow: hidden;
  }

  .sidebar.collapsed { width: 0; border: none; }

  .sidebar-header {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .knowledge-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    background: var(--accent);
    color: #0d0d0d;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  .knowledge-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
  }

  .knowledge-item {
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
    cursor: default;
    transition: background 0.15s;
  }

  .knowledge-item:hover { background: var(--surface2); }

  .ki-q {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent2);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ki-a {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ki-del {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    padding: 0 0 0 6px;
    line-height: 1;
  }
  .ki-del:hover { color: var(--danger); }

  .sidebar-add {
    padding: 0.75rem;
    border-top: 1px solid var(--border);
  }

  .add-form { display: flex; flex-direction: column; gap: 6px; }

  .add-form input {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 7px 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    outline: none;
    transition: border 0.15s;
  }
  .add-form input:focus { border-color: var(--accent); }
  .add-form input::placeholder { color: var(--muted); }

  .add-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 7px;
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
    transition: opacity 0.15s;
  }
  .add-btn:hover { opacity: 0.85; }

  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  .message {
    display: flex;
    gap: 10px;
    max-width: 80%;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.bot { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }

  .message.user .avatar { background: var(--accent); color: #0d0d0d; }
  .message.bot .avatar { background: var(--accent2); color: #0d0d0d; }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 100%;
    word-break: break-word;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #2a3d2a;
    border-top-right-radius: 2px;
  }

  .message.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid #2a2a3d;
    border-top-left-radius: 2px;
  }

  .bubble.typing {
    display: flex; gap: 4px; align-items: center; padding: 12px 16px;
  }

  .dot {
    width: 6px; height: 6px;
    background: var(--accent2);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .msg-time {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    text-align: right;
  }
  .message.bot .msg-time { text-align: left; }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 1rem 1.5rem;
    background: var(--surface);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .input-wrap { flex: 1; position: relative; }

  #main-input {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    resize: none;
    transition: border 0.15s;
    max-height: 120px;
    overflow-y: auto;
  }
  #main-input:focus { border-color: var(--accent); }
  #main-input::placeholder { color: var(--muted); }

  .send-btn {
    width: 44px; height: 44px;
    border-radius: 8px;
    background: var(--accent);
    border: none;
    color: #0d0d0d;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.95); }

  .toggle-sidebar {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 18px; padding: 2px;
    transition: color 0.15s;
  }
  .toggle-sidebar:hover { color: var(--accent); }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 1rem;
    color: var(--muted);
    text-align: center;
    padding: 2rem;
  }

  .empty-icon { font-size: 3rem; }

  .empty-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--text);
  }

  .empty-sub { font-size: 13px; line-height: 1.6; max-width: 300px; }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 0.5rem;
  }

  .suggestion-chip {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .suggestion-chip:hover { border-color: var(--accent); color: var(--accent); }

  .mode-badge {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 700;
  }
  .mode-badge.ai { background: #1a2a4d; color: var(--accent2); border: 1px solid #2a3d6d; }
  .mode-badge.local { background: #1a2a1a; color: var(--accent); border: 1px solid #2a3d2a; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .ai-toggle {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Space Mono', monospace; font-size: 11px;
    color: var(--muted); cursor: pointer;
  }
  
  .toggle-switch {
    position: relative; width: 32px; height: 18px;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px; cursor: pointer;
    transition: 0.2s;
  }
  .toggle-slider:before {
    position: absolute;
    content: ""; height: 12px; width: 12px;
    left: 2px; bottom: 2px;
    background: var(--muted);
    border-radius: 50%;
    transition: 0.2s;
  }
  input:checked + .toggle-slider { background: #1a2a4d; border-color: var(--accent2); }
  input:checked + .toggle-slider:before { transform: translateX(14px); background: var(--accent2); }

  .notification {
    position: fixed;
    bottom: 80px; right: 20px;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Space Mono', monospace;
    animation: slideIn 0.2s ease;
    z-index: 100;
  }
  .notification.success { background: #1a2a1a; border: 1px solid var(--accent); color: var(--accent); }
  .notification.error { background: #2a1a1a; border: 1px solid var(--danger); color: var(--danger); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 600px) {
    .sidebar { display: none; }
    .message { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <button class="toggle-sidebar" id="sidebarToggle" title="Bilimlar paneli">☰</button>
    <div class="logo-dot"></div>
    <div class="logo-text"><span>Murod</span> AI</div>
  </div>
  <div class="header-actions">
    <span id="mode-indicator" class="mode-badge local">LOCAL</span>
    <button class="btn" id="exportBtn" title="JSON eksport">↓ Eksport</button>
    <button class="btn" id="importBtn" title="JSON import">↑ Import</button>
    <button class="btn danger" id="clearBtn">Tozalash</button>
  </div>
  <input type="file" id="fileInput" accept=".json" style="display:none">
</header>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Bilimlar bazasi</span>
      <span class="knowledge-count" id="knowledgeCount">0</span>
    </div>
    <div class="knowledge-list" id="knowledgeList"></div>
    <div class="sidebar-add">
      <div class="add-form">
        <input type="text" id="newQ" placeholder="Savol / kalit so'z..." />
        <input type="text" id="newA" placeholder="Javob..." />
        <button class="add-btn" id="addKnowledge">+ O'qitish</button>
      </div>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">Murod AI tayyormi?</div>
        <div class="empty-sub">Menga savol bering yoki yangi bilim o'rgating. Claude AI bilan ulanganda yanada aqlli javoblar beraman.</div>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="sendChip('Salom!')">Salom!</button>
          <button class="suggestion-chip" onclick="sendChip('Nima bilasiz?')">Nima bilasiz?</button>
          <button class="suggestion-chip" onclick="sendChip('O\'zbek tili haqida gapiring')">O'zbek tili</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px; width:100%">
        <label class="ai-toggle">
          <label class="toggle-switch">
            <input type="checkbox" id="aiToggle">
            <span class="toggle-slider"></span>
          </label>
          Claude AI
        </label>
        <div class="status-bar" id="statusBar">hazir</div>
      </div>
    </div>

    <div class="input-area" style="padding-top:0; border-top:none">
      <div class="input-wrap">
        <textarea id="main-input" rows="1" placeholder="Xabar yozing... (Enter = yuborish, Shift+Enter = yangi qator)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script>
const DB_KEY = 'murod_ai_data';

function loadMemory() {
  try {
    const d = localStorage.getItem(DB_KEY);
    if (d) return JSON.parse(d);
  } catch(e) {}
  return { knowledge: {}, conversations: [] };
}

function saveMemory() {
  localStorage.setItem(DB_KEY, JSON.stringify(memory));
}

let memory = loadMemory();
let aiEnabled = false;
let isTyping = false;

const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('emptyState');
const mainInput = document.getElementById('main-input');
const sendBtn = document.getElementById('sendBtn');
const knowledgeList = document.getElementById('knowledgeList');
const knowledgeCount = document.getElementById('knowledgeCount');
const aiToggle = document.getElementById('aiToggle');
const statusBar = document.getElementById('statusBar');
const modeIndicator = document.getElementById('mode-indicator');
const sidebar = document.getElementById('sidebar');

function now() {
  return new Date().toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' });
}

function renderKnowledge() {
  const items = Object.entries(memory.knowledge);
  knowledgeCount.textContent = items.length;
  knowledgeList.innerHTML = '';
  if (!items.length) {
    knowledgeList.innerHTML = '<div style="padding:1rem; font-size:12px; color:var(--muted); text-align:center;">Hali hech narsa yo\'qilmagan.</div>';
    return;
  }
  items.forEach(([q, a]) => {
    const div = document.createElement('div');
    div.className = 'knowledge-item';
    div.innerHTML = `<button class="ki-del" onclick="deleteKnowledge('${q.replace(/'/g,"\\'")}')">×</button>
      <div class="ki-q">${q}</div>
      <div class="ki-a">${a}</div>`;
    knowledgeList.appendChild(div);
  });
}

function deleteKnowledge(q) {
  delete memory.knowledge[q];
  saveMemory();
  renderKnowledge();
  notify('O\'chirildi', 'success');
}

function addMessage(text, role, typing = false) {
  if (emptyState) emptyState.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = `message ${role}`;
  const avatarText = role === 'user' ? 'SIZ' : 'AI';
  let bubbleContent = typing
    ? `<div class="bubble typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`
    : `<div class="bubble">${text}</div><div class="msg-time">${now()}</div>`;
  msg.innerHTML = `<div class="avatar">${avatarText}</div><div>${bubbleContent}</div>`;
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return msg;
}

function localMatch(input) {
  const lower = input.toLowerCase();
  for (const [q, a] of Object.entries(memory.knowledge)) {
    if (lower.includes(q.toLowerCase()) || q.toLowerCase().includes(lower)) {
      return a;
    }
  }
  return null;
}

async function callClaude(userMsg) {
  const knowledgeContext = Object.entries(memory.knowledge)
    .map(([q, a]) => `- "${q}": ${a}`).join('\n');
  
  const systemPrompt = `Siz Murod AI - o'zbek tilida gaplashadigan aqlli yordamchi.
${knowledgeContext ? `\nSizning bilimlar bazangiz:\n${knowledgeContext}\n` : ''}
Qisqa, aniq va do'stona javob bering. O'zbek tilida javob bering.`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMsg }]
    })
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  return data.content.map(c => c.text || '').join('');
}

async function handleSend() {
  const text = mainInput.value.trim();
  if (!text || isTyping) return;
  
  mainInput.value = '';
  mainInput.style.height = 'auto';
  isTyping = true;
  sendBtn.disabled = true;

  addMessage(text, 'user');
  
  const typingMsg = addMessage('', 'bot', true);
  statusBar.textContent = aiEnabled ? 'Claude API bilan bog\'lanmoqda...' : 'o\'ylayapman...';

  let response = '';

  try {
    if (aiEnabled) {
      response = await callClaude(text);
    } else {
      await new Promise(r => setTimeout(r, 400));
      const local = localMatch(text);
      response = local || 'Kechirasiz, bu haqida hali bilmayman. Meni o\'qiting yoki Claude AI ni yoqing!';
    }
  } catch(e) {
    response = `⚠️ Xatolik: ${e.message}`;
    modeIndicator.className = 'mode-badge local';
    modeIndicator.textContent = 'LOCAL';
  }

  typingMsg.remove();
  addMessage(response, 'bot');

  memory.conversations.push({
    time: new Date().toISOString(),
    user: text,
    bot: response,
    mode: aiEnabled ? 'claude' : 'local'
  });
  if (memory.conversations.length % 5 === 0) saveMemory();

  isTyping = false;
  sendBtn.disabled = false;
  statusBar.textContent = aiEnabled ? 'Claude AI faol' : 'lokal rejim';
}

function sendChip(text) {
  mainInput.value = text;
  handleSend();
}

function notify(msg, type = 'success') {
  const n = document.createElement('div');
  n.className = `notification ${type}`;
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2500);
}

sendBtn.addEventListener('click', handleSend);
mainInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
mainInput.addEventListener('input', () => {
  mainInput.style.height = 'auto';
  mainInput.style.height = Math.min(mainInput.scrollHeight, 120) + 'px';
});

aiToggle.addEventListener('change', () => {
  aiEnabled = aiToggle.checked;
  modeIndicator.className = `mode-badge ${aiEnabled ? 'ai' : 'local'}`;
  modeIndicator.textContent = aiEnabled ? 'CLAUDE AI' : 'LOCAL';
  statusBar.textContent = aiEnabled ? 'Claude AI faol' : 'lokal rejim';
  notify(aiEnabled ? '🤖 Claude AI yoqildi' : '💾 Lokal rejim', 'success');
});

document.getElementById('addKnowledge').addEventListener('click', () => {
  const q = document.getElementById('newQ').value.trim();
  const a = document.getElementById('newA').value.trim();
  if (!q || !a) { notify('Savol va javob kiriting!', 'error'); return; }
  memory.knowledge[q.toLowerCase()] = a;
  saveMemory();
  renderKnowledge();
  document.getElementById('newQ').value = '';
  document.getElementById('newA').value = '';
  notify('✅ O\'qitildi!', 'success');
});

document.getElementById('newA').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addKnowledge').click();
});

document.getElementById('sidebarToggle').addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (confirm('Barcha bilim va suhbatlarni o\'chirishni xohlaysizmi?')) {
    memory = { knowledge: {}, conversations: [] };
    saveMemory();
    renderKnowledge();
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyState);
    emptyState.style.display = '';
    notify('🗑️ Tozalandi', 'success');
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  saveMemory();
  const blob = new Blob([JSON.stringify(memory, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'murod_ai_backup.json'; a.click();
  URL.revokeObjectURL(url);
  notify('📥 Eksport qilindi', 'success');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.knowledge) {
        memory.knowledge = { ...memory.knowledge, ...data.knowledge };
        saveMemory(); renderKnowledge();
        notify(`✅ ${Object.keys(data.knowledge).length} ta bilim import qilindi`, 'success');
      }
    } catch(er) { notify('Fayl xato!', 'error'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

renderKnowledge();
</script>
</body>
